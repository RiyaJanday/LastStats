server:
  port: 8082

spring:
  application:
    name: portfolio-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:laststats}
    username: ${DB_USER:laststats}
    password: ${DB_PASSWORD:laststats123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Must match auth-service's jwt.secret exactly — this service only
# validates tokens issued by auth-service, it never issues its own.
jwt:
  secret: ${JWT_SECRET:laststats_jwt_super_secret_key_must_be_256bits_long_abcdefgh}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
